name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests app
      - uses: actions/cache@v4
        with:
          path: data/raw
          key: statsbomb-fixtures-${{ hashFiles('src/fdl/config.py') }}
      - run: python -m fdl download --fixtures
      - run: pytest
